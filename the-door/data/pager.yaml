# Eerie pager messages for the randomizer on the Omens page.
# Routine, automated job pages live with each role in characters.yaml (Crew page).
# Write the result on a slip of paper and hand it to one player privately.
# Each category has an id, a label, a short GM hint and a list of messages (from + text).

- id: pages
  label: False Pages
  hint: The Door reaches out. Locations only send automated messages, so make them wrong rather than personal; only people get personal. Use from Act II on.
  messages:
    - from: "DRONE CTRL"
      text: "D-2 is moving on its own. Come to the monitors. Now."
    - from: "DRONE CTRL"
      text: "Camera 7 shows you in tunnel C. Where are you really?"
    - from: "UNKNOWN"
      text: "Who is in the messhall?"
    - from: "UNKNOWN"
      text: "You left the door open."
    - from: "YOU"
      text: "It's me. Don't trust what I say tomorrow."
    - from: "LIFE SUPPORT"
      text: "O2 RECYCLER OFFLINE: CREW QUARTERS"
    - from: "REACTOR"
      text: "COOLANT WARNING. MANUAL CHECK REQUIRED"
    - from: "MECH BAY"
      text: "JEEP 2 CHECKED OUT. NO OPERATOR ID"
    - from: "BOTANY"
      text: "TRAY 4 GROWTH +340% IN 6H. NO SEED LOGGED"
    - from: "AIR LOCK"
      text: "CYCLE REQUEST FROM OUTSIDE. NO CREW LOGGED OUT"
    - from: "MED BAY"
      text: "CRYO POD 6 OCCUPIED"
    - from: "DRONE STATION"
      text: "CAMERA 7: MOTION DETECTED. NO PERSONNEL IN SECTOR"
    - from: "RELAY"
      text: "1 PERSONAL MESSAGE. DELIVERY FAILED. RETRYING"

- id: captain
  label: The Captain
  hint: Pages that seem to come from the missing captain. Strongest in Act II and III.
  messages:
    - from: "CAPTAIN"
      text: "I'm fine. Keep the cameras on."
    - from: "CAPTAIN"
      text: "Stop looking for me."
    - from: "CAPTAIN"
      text: "Leave it alone. The machines must keep running."
    - from: "CAPTAIN"
      text: "Who gave you permission?"
    - from: "CAPTAIN"
      text: "I can see you."
    - from: "CAPTAIN"
      text: "Bring my card back."

- id: hints
  label: Hints
  hint: Barely-there nudges. Never a tip; they should only make sense in hindsight.
  messages:
    - from: "UNKNOWN"
      text: "It's shy."
    - from: "UNKNOWN"
      text: "Shhh."
    - from: "UNKNOWN"
      text: "Good night."
    - from: "UNKNOWN"
      text: "You blinked."
    - from: "UNKNOWN"
      text: "Don't stare."
    - from: "UNKNOWN"
      text: "Everyone is asleep."
    - from: "UNKNOWN"
      text: "It's patient."
    - from: "UNKNOWN"
      text: "Knock knock."
    - from: "UNKNOWN"
      text: "It's so bright in here."
    - from: "UNKNOWN"
      text: "Are you still watching?"

- id: company
  label: Daedalus HQ
  hint: Delayed company replies. Always some version of "wait and ignore the Door".
  messages:
    - from: "DAEDALUS HQ"
      text: "Report received. Await instructions. Do not interact with the anomaly."
    - from: "DAEDALUS HQ"
      text: "Maintain production quotas. Further instructions pending."
    - from: "DAEDALUS HQ"
      text: "Captain's status noted. Chain of command will be assigned. Await instructions."
    - from: "DAEDALUS HQ"
      text: "Security assessment in progress. Ignore the anomaly for now."
    - from: "DAEDALUS HQ"
      text: "Reminder - unauthorised use of explosives voids your contract bonus."
    - from: "DAEDALUS HQ"
      text: "Supply drop on schedule. Keep the machines running."

- id: missing
  label: From the Missing
  hint: Examples for players who opened the Door. Let them write their own; no spoilers.
  messages:
    - from: "???"
      text: "It's warm here."
    - from: "???"
      text: "Don't come looking."
    - from: "???"
      text: "I can see you on the monitors."
    - from: "???"
      text: "Bring me my jacket."
    - from: "???"
      text: "You should have come with me."
