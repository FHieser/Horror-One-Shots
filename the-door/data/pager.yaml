# Eerie pager messages for the randomizer on the Omens page.
# Routine, automated job pages live with each role in characters.yaml (Crew page).
# Write the result on a slip of paper and hand it to one player privately.
# Each category has an id, a label, a short GM hint and a list of messages (from + text).

- id: pages
  label: False Pages
  hint: The Door reaches out. Replace [PLAYER] with the name of another player. Use from Act II on.
  messages:
    - from: "???"
      text: "Dangerous?"
    - from: "???"
      text: "Flee."
    - from: "???"
      text: "Cameras out."
    - from: "???"
      text: "Open me."
    - from: "???"
      text: "Destroy me."
    - from: "???"
      text: "Research me."
    - from: "???"
      text: "[PLAYER] wants to open me."
    - from: "???"
      text: "Kill or be killed."
    - from: "???"
      text: "Knock knock."
    - from: "???"
      text: "I will fulfil your dreams."
    - from: "???"
      text: "I can see you."
    - from: "???"
      text: "[PLAYER] has a weapon."
    - from: "???"
      text: "The stars look so beautiful today."

- id: captain
  label: The Captain
  hint: Pages that seem to come from the missing captain. Strongest in Act II and III.
  messages:
    - from: "CAPTAIN"
      text: "I'm fine. Keep the cameras on."
    - from: "CAPTAIN"
      text: "Stop looking for me."
    - from: "CAPTAIN"
      text: "Leave it alone. The machines must keep running."
    - from: "CAPTAIN"
      text: "Who gave you permission?"
    - from: "CAPTAIN"
      text: "I can see you."
    - from: "CAPTAIN"
      text: "Bring my card back."

- id: hints
  label: Hints
  hint: Barely-there nudges. Never a tip; they should only make sense in hindsight. Replace [VANISHED] with a character who disappeared.
  messages:
    - from: "UNKNOWN"
      text: "What did the captain see?"
    - from: "UNKNOWN"
      text: "What did [VANISHED] see?"
    - from: "UNKNOWN"
      text: "Don't stare."
    - from: "UNKNOWN"
      text: "You don't see me."
    - from: "UNKNOWN"
      text: "Are you still watching?"

- id: broadcast
  label: Station-Wide
  hint: Fake station-wide alarms. Every player receives it at the same time. None of it is real.
  messages:
    - from: "ALL CREW"
      text: "EMERGENCY MEETING. MESSHALL. NOW"
    - from: "ALL CREW"
      text: "REACTOR MELTDOWN IMMINENT"
    - from: "ALL CREW"
      text: "LIFE SYSTEMS TURNED OFF"
