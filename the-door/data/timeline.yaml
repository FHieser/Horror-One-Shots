- intro: |
    **This is an example setup.** It shows how a session usually unfolds, not a script you have to follow. Act I is fixed; from Act II on, the players drive and you react. The full GM text for each act is on the Overview page.

- phase: ACT I — THE DOOR

- label: Pager
  type: facility
  title: A Beep in the Night
  text: Drone Control's pager goes off in the night cycle. Before anyone wakes, describe the empty station from the mines upwards. End at Drone Control, or with the player they call.

- label: Monitors
  type: player
  title: Something on the Feed
  text: A door, set into raw rock. Players investigate through the drones and cameras, wake others and argue. The Door does nothing. The captain is called.

- label: Going Down
  type: player
  title: Every Door Is Different
  text: The captain and a few players drive down. Each player sees their own drawn door. If someone reaches for a handle only they can see, everyone else gets a headache and makes a Sanity Save.

- label: Orders
  type: facility
  title: The Captain Decides
  text: Leave it alone and keep it watched. No drones or heavy machines near it. The machines and the daily tasks keep running. Everyone goes back to bed.

- label: Disappearance
  type: warning
  title: The Captain Goes Down Alone
  text: In the early morning the captain drives to the Door without answering any pages and shoots out the cameras. There is no more footage after that.

- label: Empty Spot
  type: warning
  title: Card and Gun
  text: In front of the Door lie the captain's security card and gun. The captain is gone. Let everyone who wants to drive down and look. The act ends here.

- phase: ACT II — THE VACUUM

- label: Routine
  type: player
  title: Back to Work
  text: The players return to their daily tasks. Let the routine play out.

- label: False Pages
  type: warning
  title: The Door Reaches Out
  text: Pass omens and misleading pager messages to individual players as private paper notes. Start with minor omens, then escalate.

- label: Who Leads?
  type: player
  title: The Empty Chair
  text: Who takes the captain's place? Let it be contested. Company messages arrive late and say to wait and ignore the Door for now.

- label: Teams
  type: player
  title: Factions Form
  text: Leave it alone, blow it up, or open it. Steer towards internal discussion and open conflict.

- label: The Click
  type: warning
  optional: true
  title: Opening It in Secret
  text: A player tries alone, in a separate room. Lights out and cameras destroyed or off, and the Door clicks. If they open it, they are out of the game and may only send spoiler-free pager messages.

- label: Missing
  type: warning
  optional: true
  title: Someone Is Gone
  text: Only the person who vanished knows why. The rest have fragments and pages from someone who is no longer there.

- label: Something Big
  type: facility
  title: Act III Begins
  text: An explosion, an opening or a mass confrontation at the Door starts the final act.

- phase: ACT III — CHAOS

- label: Collision
  type: player
  title: The Teams Play Out
  text: Plans get carried out, sabotaged or fought over. Players turn drastic or apathetic. Player-on-player violence is welcome.

- label: Visions
  type: warning
  title: Nothing Is Deniable
  text: Major omens and beyond. Shared hallucinations, and the missing seen in corridors and on feeds. The pager messages become personal.

- label: Captain on Tape
  type: facility
  title: Never Caught
  text: The captain is sighted on camera. Then the reactor melts down, life support fails, the airlock is sabotaged, or the machines turn on the crew.

- label: Few Remain
  type: warning
  title: The Crew Breaks
  text: The act ends when the crew is broken. Not many should be left standing.

- phase: EPILOGUE

- label: Two Weeks
  type: facility
  title: The Security Team
  text: A Daedalus team lands, secures the Door and whoever is still alive. Describe the arrival for each survivor individually.

- note: |
    **Callbacks.** Throughout Acts II and III, let players and NPCs echo the captain's last orders: *leave it alone, keep it watched, the machines must keep running.*
