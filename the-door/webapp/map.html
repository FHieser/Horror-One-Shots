  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d0d0d; font-family: Georgia, serif; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
    header { background: #0a0000; border-bottom: 2px solid #330000; padding: 0.5rem 1.5rem; display: flex; align-items: center; gap: 2rem; position: sticky; top: 0; z-index: 10; flex-shrink: 0; }
    .brand { color: #666; font-size: 0.8rem; text-decoration: none; font-family: 'Courier New', monospace; letter-spacing: 0.08em; text-transform: uppercase; }
    .brand:hover { color: #cc2222; }
    .brand-sep { color: #330000; margin: 0 0.3rem; }
    .adv-brand { color: #cc2222; font-size: 1.1rem; letter-spacing: 0.05em; text-decoration: none; font-family: Georgia, serif; }
    nav { display: flex; margin-left: auto; }
    nav a { color: #666; text-decoration: none; font-size: 0.82rem; padding: 0.3rem 1rem; border: 1px solid transparent; letter-spacing: 0.06em; text-transform: uppercase; }
    nav a:hover { color: #cc2222; }
    nav a.active { color: #cc2222; border-color: #330000; background: #1a0000; }
    nav a + a { border-left: none; }
    #map-area { flex: 1; overflow: auto; background: #080808; padding: 1.5rem 1rem; }
    #map-wrapper { width: min(100%, 1150px); min-width: 680px; margin: 0 auto; }
    #map-wrapper svg { width: 100%; height: auto; display: block; }

    /* Map styling */
    .bg { fill: #080808; }
    .title { fill: #cc2222; font: 600 15px 'Courier New', monospace; letter-spacing: 3px; }
    .sub { fill: #8a8a8a; font: 11px 'Courier New', monospace; letter-spacing: 1px; }
    .section { fill: #c07a3a; font: 10px 'Courier New', monospace; letter-spacing: 3px; }
    .ground { stroke: #c07a3a; stroke-width: 1.5; opacity: 0.8; }
    .conn { stroke: #9a8c8c; stroke-width: 2; }
    .room rect { fill: #161212; stroke: #8a3030; stroke-width: 2.5; transition: fill 0.15s, stroke 0.15s; }
    .room text { fill: #f0e6e6; font: 13px system-ui, -apple-system, 'Segoe UI', sans-serif; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
    .room:hover rect, .room:focus rect { fill: #2e0c0c; stroke: #ff5050; }
    .room:hover text, .room:focus text { fill: #ffffff; }
    .room.pad rect { fill: #3a3030; stroke: #8a3030; }
    .room.mines rect { fill: #0f120c; stroke: #6a8a4a; stroke-dasharray: 8 5; }
    .room.mines:hover rect { fill: #18200f; stroke: #a8d878; }
    .door rect { fill: #cc2222; stroke: none; }
    .door circle { fill: #080808; }
    .door-label { fill: #ff6060; font: 10px 'Courier New', monospace; letter-spacing: 2px; }
  </style>
