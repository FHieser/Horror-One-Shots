  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d0d0d; font-family: Georgia, serif; }
    header { background: #0a0000; border-bottom: 2px solid #330000; padding: 0.5rem 1.5rem; display: flex; align-items: center; gap: 2rem; position: sticky; top: 0; z-index: 10; }
    .brand { color: #666; font-size: 0.8rem; text-decoration: none; font-family: 'Courier New', monospace; letter-spacing: 0.08em; text-transform: uppercase; }

    .brand-sep { color: #330000; margin: 0 0.3rem; }
    .adv-brand { color: #cc2222; font-size: 1.1rem; letter-spacing: 0.05em; text-decoration: none; font-family: Georgia, serif; }
    nav { display: flex; margin-left: auto; }
    nav a { color: #666; text-decoration: none; font-size: 0.82rem; padding: 0.3rem 1rem; border: 1px solid transparent; letter-spacing: 0.06em; text-transform: uppercase; }
    nav a:hover { color: #cc2222; }
    nav a.active { color: #cc2222; border-color: #330000; background: #1a0000; }
    nav a + a { border-left: none; }
    .content { max-width: 820px; margin: 0 auto; padding: 2.5rem 1.5rem 5rem; }
    h1 { color: #cc2222; font-size: 1.8rem; border-bottom: 2px solid #330000; padding-bottom: 0.5rem; margin-bottom: 1.5rem; }
    h2 { color: #cc2222; font-size: 1.5rem; border-bottom: 1px solid #330000; padding-bottom: 0.4rem; margin-bottom: 1.2rem; margin-top: 2.5rem; }
    h3 { color: #aa3333; font-size: 1rem; margin: 1.4rem 0 0.5rem; letter-spacing: 0.02em; }
    p { color: #b8b8b8; font-size: 0.9rem; line-height: 1.75; margin-bottom: 0.5rem; }
    ul { color: #b8b8b8; font-size: 0.9rem; line-height: 1.75; padding-left: 1.4rem; margin-bottom: 0.6rem; list-style: none; }
    li { margin-bottom: 0.2rem; }
    li::before { content: "›  "; color: #cc2222; }
    strong { color: #e0e0e0; }
    em { color: #999; font-style: italic; }
    code { background: #1a1a1a; color: #7ec8e3; padding: 0.1em 0.4em; border-radius: 3px; font-size: 0.85em; }
    a { color: #cc2222; }
    a:hover { color: #ff4444; }
    h2 + p, h2 ~ p { margin-bottom: 0.9rem; }
    .excerpt { border-left: 2px solid #cc2222; padding: 0.4rem 0 0.4rem 1.2rem; margin: 0 0 2rem; }
    .excerpt p { color: #d0d0d0; font-size: 1.05rem; font-style: italic; line-height: 1.8; }
    .excerpt .excerpt-end { color: #cc2222; font-size: 1.3rem; margin-top: 0.6rem; }
    .glance { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 1px; background: #330000; border: 1px solid #330000; margin-bottom: 1rem; }
    .glance div { background: #0f0505; padding: 0.7rem 1rem; }
    .glance dt { color: #666; font-family: 'Courier New', monospace; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em; margin-bottom: 0.2rem; }
    .glance dd { color: #e0e0e0; font-size: 0.95rem; }
    .glance dd span { color: #777; font-size: 0.8rem; }
    blockquote { border: 1px solid #330000; background: #120000; padding: 0.9rem 1.2rem 0.5rem; margin: 1.4rem 0 0.5rem; }
    blockquote p strong { color: #cc2222; font-family: 'Courier New', monospace; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.08em; }
