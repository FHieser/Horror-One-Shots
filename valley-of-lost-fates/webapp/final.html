<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Final — Valley of Lost Fates</title>
  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="./css/style.css">
  <style>
    .forms { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 1rem; }
    .form { border: 1px solid var(--line); background: var(--panel); padding: 1rem 1.1rem; }
    .form h3 { margin: 0 0 0.5rem; color: var(--gold); }
    .form .row { margin-top: 0.6rem; font-size: 0.86rem; }
    .form .row .label { margin-bottom: 0.1rem; }
    .form ul { font-size: 0.86rem; margin: 0; }
    .group-note { color: var(--text-dim); font-size: 0.85rem; font-style: italic; margin: -0.4rem 0 1rem; }
    .table-wrap { overflow-x: auto; margin-bottom: 1rem; }
    .pages-table { width: 100%; border-collapse: collapse; min-width: 560px; font-size: 0.88rem; }
    .pages-table th { text-align: left; font: 0.7rem 'Courier New', monospace; letter-spacing: 0.08em; text-transform: uppercase; color: var(--gold); padding: 0.45rem 0.7rem; border-bottom: 1px solid var(--gold-dim); }
    .pages-table td { padding: 0.4rem 0.7rem; border-bottom: 1px solid var(--line); }
    .pages-table tr:hover td { background: var(--panel); }
    .pages-table a { text-decoration: none; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="../../">Horror One-Shots</a>
    <span class="brand-sep">/</span>
    <a class="adv-brand" href="./">Valley of Lost Fates</a>
    <nav>
      <a href="./">Overview</a>
      <a href="./map.html">Map</a>
      <a href="./locations.html">Locations</a>
      <a href="./cards.html">Cards</a>
      <a href="./final.html" class="active">Final</a>
      <a href="./gear.html">Gear</a>
      <a href="./lore.html">Lore</a>
    </nav>
  </header>
  <div class="content wide">
    <h1>The Final Location</h1>
    <div id="final"><p class="loading">LOADING…</p></div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <script src="./js/app.js"></script>
  <script>initFinal().catch(e => { document.querySelector('.content').insertAdjacentHTML('beforeend', '<p class="dim">Error: ' + e.message + '</p>'); });</script>
</body>
</html>
