<!DOCTYPE html>
<html lang="en">

  <link rel="icon" type="image/svg+xml" href="../../favicon.svg">
  <link rel="stylesheet" href="./css/style.css">
  <style>
    .roles { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 1rem; margin-top: 1rem; }
    .role { border: 1px solid var(--line); background: var(--panel); padding: 1rem 1.1rem; }
    .role h3 { margin: 0; color: var(--text-bright); font-size: 1.2rem; }
    .role .de { color: var(--text-dim); font-size: 0.8rem; font-style: italic; margin-bottom: 0.6rem; }
    .role .duty { font-size: 0.9rem; margin-bottom: 0.6rem; }
    .role ul { font-size: 0.86rem; margin: 0; }
  </style>
</head>
<body>
  <header>
    <a class="brand" href="../../">Horror One-Shots</a>
    <span class="brand-sep">/</span>
    <a class="adv-brand" href="./">Valley of Lost Fates</a>
    <nav>
      <a href="./">Overview</a>
      <a href="./map.html">Map</a>
      <a href="./locations.html">Locations</a>
      <a href="./cards.html">Cards</a>
      <a href="./final.html">Final</a>
      <a href="./crew.html" class="active">Crew</a>
      <a href="./lore.html">Lore</a>
    </nav>
  </header>
  <div class="content wide">
    <h1>The Expedition</h1>
    <div id="crew"><p class="loading">LOADING…</p></div>
  </div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
  <script src="./js/app.js"></script>
  <script>initCrew().catch(e => { document.querySelector('.content').insertAdjacentHTML('beforeend', '<p class="dim">Error: ' + e.message + '</p>'); });</script>
</body>
</html>
