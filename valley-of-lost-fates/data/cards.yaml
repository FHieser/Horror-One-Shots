    upright:
      - "Ah, the hearts of lovers will overcome even the greatest obstacles. But love is sadly not eternal, so make haste while it lasts."
      - "Travelling between the locations of this region is immediate via portals and costs no Resources."
      - "This lasts until the first rest."
    reversed:
      - "While the players are in this region, two characters become soul-shackled."
