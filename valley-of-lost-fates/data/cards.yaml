# The 22 major arcana. Shown on webapp/cards.html.
# category: yellow (single location) | red (whole region) | blue (whole map)
# artifact: A1 | A2 | A3 for artifact cards (they make their location an artifact location)
# upright / reversed: effect lines, one line each. Empty list = still to be written.

system:
  - "The cards represent the encounters and events that can happen in the valley."
  - "Yellow cards are single-location encounters. When the players visit that place, they meet the card's event or character there."
  - "Yellow cards are either artifact cards or non-artifact cards. An artifact card turns its location into an artifact location."
  - "The players have to collect up to 3 different artifacts to unlock the final region."
  - "Red cards are regional effects. They warp specific rules of a region."
  - "Blue cards affect the whole map."

cards:
  - id: 0
    name: The Fool
    german: Der Narr
    category: yellow
    upright:
      - "Teleport to a location of choice."
    reversed:
      - "In this region the party stumbles across an artifact: seemingly valuable and found with almost no effort."
      - "No checks are needed; it appears entirely genuine and significant."
      - "The moment they leave the region, it crumbles to dust or vanishes into thin air, without explanation or benefit."
      - "All that remains is frustration, and the creeping sense that their confidence and judgement may have been misplaced."

  - id: 1
    name: The Magician
    german: Der Magier
    category: yellow
    upright:
      - "Sends the players to one of the other regions (dice roll). They have to fetch a medallion there."
      - "Promises to support the players if they want to change the fate of a location."
      - "Once they bring him the medallion, he gifts them a token of gratitude."
      - "With the token, the players can call him to change the location they are in: return the region's payments, or flip the region's card and reset it."
    reversed:
      - "Sends the players to one of the other regions (dice roll), promising an artifact of invincibility. They have to fetch a medallion there."
      - "When the players return, the mage is gone."

  - id: 2
    name: The High Priestess
    german: Die Hohepriesterin
    category: yellow
    upright:
      - "The players meet the old storyteller."
      - "She tells them three facts about cards currently in play, but not which cards they are."
    reversed:
      - "The players meet the old storyteller."
      - "She tells them three facts, but they are about cards that are currently not in play."

