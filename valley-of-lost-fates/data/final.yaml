# The final location. Shown on webapp/final.html.
# The ruler / people / realm forms below are the old variant idea (one per artifact tier). Being replaced by one boss form.

unlock:
  - "When the players hold all three pages (the First, Second and Third Reading), the final region beyond the Lighthouse opens up."

arrival:
  - "A whirlpool at the cliff of the Lighthouse."
  - "The players have to jump in to reach the end and escape."
  - "There they meet the meteor, in the form of a monster."

rulers:
  - card: No card
    theme:
      - "Blank pages."
      - "An empty room."
      - "A rock floating around as the enemy."
    attack: "Summons windows into stories, out of which attacks come."
    ability1: "Freezes a player for 1 turn in a time fracture."
    ability2: "Triggers a Stress ailment: the player relives a tragic memory again and again."
  - card: The Emperor
    theme:
      - "Tyranny and control."
      - "A throne room of iron."
      - "Shadowy soldiers."
    attack: "Melee: sword."
    ability1: "Conjures soldiers."
    ability2: "Lets 3 soldiers act."
  - card: The Empress
    theme:
      - "Decadence and decay."
      - "A rotting throne room."
      - "Withered plants."
    attack: "Withering touch."
    ability1: "Summons a wall of thorns."
    ability2: "Attacks are thrown back at the attacker."
  - card: The Hierophant
    theme:
      - "Fanaticism and self-glorification."
      - "Candles."
      - "Symbols on the floor: a circle split into 5 areas (the 4 cardinal directions plus the centre)."
    attack: "Candles: ranged fireball."
    ability1: "Ritual circle that deals damage on its next activation."
    ability2: "Ritual circle that you can't see out of."

people:
  - card: Strength
    theme:
      - "A single strong supporter of the ruler."
      - "A great wolf."
  - card: Justice
    theme:
      - "A large number of weak supporters."
      - "Fanaticism."
  - card: Temperance
    theme: []

realms:
  - card: The Star
    theme:
      - "Restructuring."
      - "False paths."
    effect: "The positions of the areas change."
  - card: The Moon
    theme: []
  - card: The Sun
    theme: []

open:
  - "One boss form instead of the ruler / people / realm variants."
  - "Stats (HeartCore adversary format)."
