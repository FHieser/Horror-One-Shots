# Adversaries (HeartCore / Daggerheart adversary format). Shown on the location pages that list them under adversaries:.
# id: referenced from data/locations.yaml

- id: shadefin-scuttler
  name: Shadefin Scuttler
  category: Minion
  description: Gaunt fish-shapes of living shadow that sprint upright on spindly hind fins, gills fluttering as they run.
    They pour out of dark patches in a writhing tide, strike all at once, then scatter in every direction before anyone
    can answer.
  motives: Swarm the nearest target, strike together, scatter, regroup out of reach
  tiers:
  - tier: 1
    difficulty: 11
    hp: 1
    stress: 1
    attack:
      bonus: '+0'
      name: Needle Teeth
      range: Melee
      damage: 2 phy
    experience:
    - name: Slippery
      value: 3
    features:
    - name: Minion (3)
      type: Passive
      description: The Scuttler is defeated when they take any damage. For every 3 damage a PC deals to the Scuttler, defeat
        an additional Minion within range the attack would succeed against.
    - name: Group Attack
      type: Action
      cost: Spend a Fear
      description: Choose a target and spotlight all Shadefin Scuttlers within Close range of them. Those Minions move into
        Melee range of the target and make one shared attack roll. On a success, they deal 2 physical damage each. Combine
        this damage.
    - name: Hit and Scatter
      type: Passive
      description: After a Group Attack, all participating Scuttlers move up to Close range, each in a different direction.
