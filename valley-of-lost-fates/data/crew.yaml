# Expedition roles. Shown on webapp/crew.html.
# In HeartCore, classes are archetypes (Doctor, Mechanic, Scientist, Soldier); these roles are backgrounds with team gear on top.

intro:
  - "The expedition is the latest team sent through the door. Thanks to earlier teams, basic communications and gear have been figured out."
  - "Every player takes one expedition role on top of their HeartCore class."

roles:
  - name: Cartographer
    german: Kartograf
    duty: "Reads the cards."
    gear:
      - "The information terminal."

  - name: Logistics
    german: Logistik
    duty: "Holds the team gear."
    gear:
      - "Route stabilizers (5)."

  - name: Leader
    german: Leader
    duty: "Top-ranking officer."
    gear:
      - "Communications device: one update to the outside per game."

  - name: Assault
    german: Assault
    gear:
      - "Climbing gear."
      - "Special weapons."

  - name: Medic
    german: Sanitäter
    gear:
      - "Healing gear."
      - "A stretcher."
      - "The rations (open)."

open:
  - "What the route stabilizers do."
  - "What the information terminal shows."
  - "Which HeartCore classes fit which role, or whether any class can take any role."
